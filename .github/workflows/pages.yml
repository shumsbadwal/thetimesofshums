name: Deploy The Times of Shums

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shums-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Check that site files exist
        id: check
        run: |
          if test -f site/index.html; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - name: Configure Pages
        if: steps.check.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - name: Upload HTML
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish Pages
        if: steps.check.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
